<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <!-- Brown University Shield -->
  <g transform="translate(2, 3) scale(0.42)">
    <!-- Shield outline -->
    <path d="M5 5 L5 65 Q5 95 50 105 Q95 95 95 65 L95 5 Z" fill="#4E3629" stroke="#4E3629" stroke-width="2"/>
    <!-- Cross -->
    <line x1="50" y1="8" x2="50" y2="100" stroke="#C41230" stroke-width="12"/>
    <line x1="8" y1="42" x2="92" y2="42" stroke="#C41230" stroke-width="12"/>
    <!-- Cross outline -->
    <line x1="50" y1="8" x2="50" y2="100" stroke="white" stroke-width="8"/>
    <line x1="8" y1="42" x2="92" y2="42" stroke="white" stroke-width="8"/>
    <line x1="50" y1="8" x2="50" y2="100" stroke="#C41230" stroke-width="4"/>
    <line x1="8" y1="42" x2="92" y2="42" stroke="#C41230" stroke-width="4"/>
    <!-- Books in quarters -->
    <rect x="18" y="14" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="18" y="20" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="18" y="26" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="14" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="20" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="26" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="18" y="54" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="18" y="60" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="18" y="66" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="54" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="60" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="64" y="66" width="18" height="4" rx="1" fill="white" opacity="0.9"/>
    <!-- Sun at top -->
    <circle cx="50" cy="3" r="6" fill="#4E3629"/>
    <circle cx="50" cy="3" r="4" fill="#C41230"/>
  </g>
  <!-- BROWN text -->
  <text x="52" y="35" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="400" letter-spacing="5" fill="#4E3629">BROWN</text>
</svg>
